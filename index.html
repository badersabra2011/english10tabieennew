*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f1f5f9;color:#0f172a}body.dark{background:#0f172a;color:#f1f5f9}

<script>const UNITS=[{"n": 1, "t": "Making contact", "v": [["apartment", "شقة"], ["attach", "يرفق"], ["cancel", "يلغي"], ["definite", "مؤكد"], ["depart", "يغادر"], ["district", "منطقة"], ["junior", "ناشئ"], ["contact", "تواصل"], ["research", "بحث"], ["reply", "يرد"], ["settle in", "يستقر"], ["predict", "يتنبأ"], ["condition", "حالة"], ["region", "منطقة"]], "g": "المضارع المستمر للخطط الشخصية: He is joining your dad next month. / المضارع البسيط للمواعيد الثابتة: His flight departs at 08:30. / going to للخطط والتنبؤ بدليل، و will للقرار الفوري والعرض والوعد.", "r": "رسائل Jenny و Basim: والد Jenny سينضم لمشروع بحث زراعي مع والد Basim. الرحلة 1 أكتوبر، تغادر 08:30 وتصل 15:15. ستزور فلسطين في عطلة الشتاء 23 ديسمبر - 9 يناير.", "q": [["متى تغادر رحلة والد Jenny؟", "08:30", "09:30", "10:30", 0], ["ما معنى attach؟", "يرفق", "يلغي", "يغادر", 0], ["أي زمن نستخدمه للمواعيد الثابتة؟", "المضارع البسيط", "الماضي البسيط", "الماضي المستمر", 0]]}, {"n": 2, "t": "From here to there", "v": [["exact", "بالضبط"], ["GPS", "نظام تحديد المواقع"], ["life raft", "قارب نجاة"], ["measure", "يقيس"], ["nearly", "تقريبا"], ["orbit", "يدور في مدار"], ["position", "موقع"], ["row", "يجدف"], ["satellite", "قمر صناعي"], ["satnav", "ملاحة فضائية"], ["storm", "عاصفة"], ["wave", "موجة"], ["prize", "جائزة"], ["riddle", "لغز"], ["so far", "حتى الآن"]], "g": "المضارع التام: have just set off / المضارع التام المستمر: have been running / الماضي البسيط مقابل المضارع التام: A ship found them at 6:30 / GPS has saved many lives.", "r": "Finding the way: فريق Mark Stubbs يجدف عبر الأطلسي من كندا إلى بريطانيا، 40 يوما و 3000 كم. في 8 أغسطس 2004 دمرت موجة قاربهم، أنقذهم قارب نجاة + هاتف فضائي + GPS. وجدتهم سفينة الساعة 6:30 صباحا.", "q": [["كم يوما قضى الفريق في البحر؟", "40 يوما", "30 يوما", "10 أيام", 0], ["ما الذي أنقذ حياتهم؟", "قارب نجاة + هاتف فضائي + GPS", "سيارة", "طائرة", 0], ["ما معنى satellite؟", "قمر صناعي", "عاصفة", "موجة", 0]]}, {"n": 3, "t": "Freetime activities", "v": [["afford", "يتحمل التكلفة"], ["business", "عمل تجاري"], ["castle", "قلعة"], ["decorate", "يزين"], ["frame", "إطار / هيكل"], ["for free", "مجانا"], ["recycle", "يعيد تدوير"], ["similar", "مشابه"], ["supply", "يزود"], ["leisure", "وقت فراغ"], ["senior", "أقدم"], ["against", "ضد"]], "g": "Modals: may/might للاحتمال، can/could للقدرة والطلب والعرض، shall للعرض، should للنصيحة، must للضرورة، have to للضرورة، don't have to لعدم الضرورة، be able to للقدرة.", "r": "Joe: عمره 14، والده فقد عمله، أصلح دراجة قديمة وبنى دراجته مجانا، ثم صنع دراجات رخيصة لأصدقائه. Ann: تصنع الكيك، كيكة قلعة أميرة، طلبات من الأمهات، ثم محل كيك، وكيكة زفاف لـ 100 شخص.", "q": [["لماذا بدأ Joe؟", "لأنه احتاج دراجة أكبر ولم يستطع أهله شراءها", "لأنه يحب الرسم", "لأنه سافر", 0], ["ما معنى recycle؟", "يعيد تدوير", "يزين", "يزود", 0], ["أي فعل نستخدمه للنصيحة؟", "should", "mustn't", "can't", 0]]}, {"n": 4, "t": "Emergency!", "v": [["alive", "على قيد الحياة"], ["ambulance", "سيارة إسعاف"], ["cheer", "يهتف فرحا"], ["desperately", "بيأس"], ["examine", "يفحص"], ["floor", "طابق"], ["ladder", "سلم"], ["lean", "يميل"], ["ledge", "حافة ضيقة"], ["rush", "يسرع"], ["smash", "يحطم"], ["explode", "ينفجر"], ["explosion", "انفجار"], ["unhurt", "غير مصاب"]], "g": "الصفات: قبل الاسم وبعد be/feel/seem/look. صفات -ing تصف الشيء (amazing)، و -ed تصف الشعور (worried). الظروف: نضيف -ly للصفة، وموقعها قبل/بعد الفعل. ظروف شاذة: hard, early, fast, well.", "r": "Young nurse saved from 10th floor fire: Helen West عمرها 19، حريق في شقتها في الطابق العاشر، حافة ضيقة 15 سم وارتفاع 30 مترا، السلم كان أقصر بـ 10 أمتار، انفجار، أنقذها Dave Yates و Ken Winterton، خرجت غير مصابة.", "q": [["كم كان عرض الحافة؟", "15 سم", "10 سم", "30 سم", 0], ["من أنقذ Helen؟", "Dave و Ken", "الشرطة فقط", "جيرانها", 0], ["ما معنى unhurt؟", "غير مصاب", "خائف", "متعب", 0]]}, {"n": 5, "t": "Dangerous weather", "v": [["accurate", "دقيق"], ["approach", "يقترب"], ["breathe", "يتنفس"], ["combine", "يجمع"], ["escape", "ينجو / يهرب"], ["force", "قوة"], ["heat", "حرارة"], ["moreover", "علاوة على ذلك"], ["poor", "فقير"], ["properly", "بشكل صحيح"], ["result", "نتيجة"], ["storm surge", "موجة العاصفة"], ["destroy", "يدمر"], ["destruction", "دمار"], ["helpless", "عاجز"], ["temperature", "درجة حرارة"]], "g": "المقارنة: -er/-est للقصيرة، more/most للطويلة، better/best شاذة، as...as للمساواة. too...to / not...enough. so...that / such...that للنتيجة: It was such a disaster that 500,000 died.", "r": "Hurricane lives: الأعاصير تصل سرعتها 118 كم/ساعة وأكثر وعرضها 800 كم. إعصار Andrew 1992 في فلوريدا كان الأغلى، ومات القليل لأن الناس هربوا بالسيارات. في بنغلادش 1970 لم يكن هناك تحذير، موجة عاصفة 10 أمتار ورياح 222 كم/ساعة، مات 500,000 شخص.", "q": [["كم كانت سرعة الرياح في بنغلادش 1970؟", "222 كم/ساعة", "118 كم/ساعة", "100 كم/ساعة", 0], ["ما معنى helpless؟", "عاجز", "دقيق", "قوي", 0], ["أي تركيب يعبر عن النتيجة؟", "such...that", "too...to", "as...as", 0]]}, {"n": 6, "t": "Working for a better world", "v": [["abroad", "في الخارج"], ["dream", "حلم"], ["give up", "يستسلم"], ["graduate", "يتخرج"], ["laboratory", "مختبر"], ["law", "قانون"], ["radiation", "إشعاع"], ["treat", "يعالج"], ["university", "جامعة"], ["war", "حرب"], ["X-ray", "أشعة سينية"], ["discover", "يكتشف"], ["discovery", "اكتشاف"]], "g": "الماضي البسيط للفعل المكتمل، والماضي المستمر للفعل المستمر: While she was studying... / الماضي التام للفعل الأقدم: By the time Jamila left school, she had written lots of poetry. / الأسماء العلم Proper Nouns تبدأ بحرف كبير.", "r": "A scientist for the world: Marie Curie (Maria Sklodowska) ولدت في وارسو 1867، منع القانون النساء من الجامعة، درست في باريس 1891 وعمرها 24، تخرجت بعد 3 سنوات، تزوجت Pierre عام 1895، وبحثت في الإشعاع. Mahmoud Darwish ولد 1942 في البروة قرب عكا، أجبرت عائلته على الرحيل عام 1948.", "q": [["أين ولدت Marie Curie؟", "وارسو", "باريس", "لندن", 0], ["متى بدأت الدراسة في باريس؟", "1891", "1895", "1867", 0], ["ما معنى graduate؟", "يتخرج", "يكتشف", "يعالج", 0]]}];
let fav=JSON.parse(localStorage.getItem('fav')||'[]');
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark'))}
if(localStorage.getItem('dark')==='true')document.body.classList.add('dark');
function toggleFav(w){fav=fav.includes(w)?fav.filter(x=>x!==w):[...fav,w];localStorage.setItem('fav',JSON.stringify(fav));render()}
function render(){const s=(document.getElementById('search').value||'').toLowerCase();let h='';
UNITS.forEach(u=>{let vs=u.v.filter(x=>x[0].toLowerCase().includes(s)||x[1].includes(s)||u.t.toLowerCase().includes(s));if(s&&!vs.length&&!u.t.toLowerCase().includes(s))return;
h+='<section class="card"><h2>الوحدة '+u.n+' – <span class="en">'+u.t+'</span></h2><h3>📖 القراءة</h3><p>'+u.r+'</p><h3>📘 القواعد</h3><p>'+u.g+'</p><h3>📚 المفردات ('+u.v.length+' كلمة)</h3><div class="vocab">'+u.v.map(x=>'<div class="word"><b class="en">'+x[0]+'</b><br>'+x[1]+'<br><button onclick="speechSynthesis.speak(new SpeechSynthesisUtterance(\''+x[0]+'\'))">🔊 استماع</button> <button onclick="toggleFav(\''+x[0]+'\')">'+(fav.includes(x[0])?'⭐':'☆')+'</button></div>').join('')+'</div><h3>✅ اختبار سريع</h3>'+u.q.map((qq,i)=>'<div class="q"><b>'+qq[0]+'</b>'+qq.slice(1,4).map((o,j)=>'<button class="opt" onclick="this.style.background=( '+j+'==='+qq[4]+' ? \'#22c55e\' : \'#ef4444\');this.style.color=\'#fff\'">'+o+'</button>').join('')+'</div>').join('')+'</section>'});document.getElementById('app').innerHTML=h||'<p style="text-align:center">لا نتائج</p>'}
render();</script></body></html>
